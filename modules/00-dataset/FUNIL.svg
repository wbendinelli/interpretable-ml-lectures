<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="Georgia, serif" font-size="14">
<rect width="1180" height="620" fill="#faf7f2"/>
<text x="590.0" y="36" text-anchor="middle" font-size="22" fill="#222">A variável-funil — por que um vazio não é uma coisa só</text>
<text x="590.0" y="58" text-anchor="middle" font-size="13" fill="#666">portão medido em 0,00% de contradição nos seis anos · exemplo impresso: CARDIOPATI 2023, walkthrough §3.2</text>
<rect x="60" y="110" width="300" height="120" rx="10" fill="#2e7d52" fill-opacity="0.10" stroke="#2e7d52" stroke-width="2"/>
<text x="210" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d52">FATOR_RISC</text>
<text x="210" y="163" text-anchor="middle" font-size="12.5" fill="#3a3a3a">"Paciente tem fator de risco?"</text>
<text x="210" y="184" text-anchor="middle" font-size="12.5" fill="#3a3a3a">1/S = sim → bloco habilitado</text>
<text x="210" y="205" text-anchor="middle" font-size="12.5" fill="#3a3a3a">outro → 13 comorbidades desligadas</text>
<rect x="470" y="96" width="290" height="148" rx="10" fill="#4a7fb5" fill-opacity="0.10" stroke="#4a7fb5" stroke-width="2"/>
<text x="615" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7fb5">as 13 comorbidades</text>
<text x="615" y="150" text-anchor="middle" font-size="12" fill="#3a3a3a">CARDIOPATI · DIABETES · ASMA ·</text>
<text x="615" y="170" text-anchor="middle" font-size="12" fill="#3a3a3a">RENAL · OBESIDADE · PUERPERA ·</text>
<text x="615" y="190" text-anchor="middle" font-size="12" fill="#3a3a3a">HEPATICA · NEUROLOGIC · …</text>
<text x="615" y="210" text-anchor="middle" font-size="12" fill="#3a3a3a">cada uma ganha a coluna _estado</text>
<path d="M 364 170 L 462 170" stroke="#8a8177" stroke-width="2.5" fill="none" marker-end="url(#arr2)"/>
<text x="413" y="160" text-anchor="middle" font-size="11.5" fill="#777">habilita</text>
<rect x="60" y="300" width="330" height="130" rx="10" fill="#b58a3e" fill-opacity="0.10" stroke="#b58a3e" stroke-width="2"/>
<text x="225" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#b58a3e">nao_aplicavel</text>
<text x="225" y="356" text-anchor="middle" font-size="12" fill="#3a3a3a">o portão disse não: o campo nunca foi</text>
<text x="225" y="377" text-anchor="middle" font-size="12" fill="#3a3a3a">apresentado — NÃO é dado faltante</text>
<text x="225" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a3a3a">CARDIOPATI 2023: 55,0% dos registros</text>
<rect x="425" y="300" width="330" height="130" rx="10" fill="#c03434" fill-opacity="0.10" stroke="#c03434" stroke-width="2"/>
<text x="590" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#c03434">ausente</text>
<text x="590" y="356" text-anchor="middle" font-size="12" fill="#3a3a3a">o campo estava habilitado e ficou</text>
<text x="590" y="377" text-anchor="middle" font-size="12" fill="#3a3a3a">em branco — isto sim é faltante</text>
<text x="590" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a3a3a">24,0% dos habilitados</text>
<rect x="790" y="300" width="330" height="130" rx="10" fill="#8a6d9b" fill-opacity="0.10" stroke="#8a6d9b" stroke-width="2"/>
<text x="955" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d9b">ignorado</text>
<text x="955" y="356" text-anchor="middle" font-size="12" fill="#3a3a3a">código 9: alguém registrou de forma</text>
<text x="955" y="377" text-anchor="middle" font-size="12" fill="#3a3a3a">explícita que não sabe</text>
<text x="955" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a3a3a">informação, não ausência</text>
<rect x="60" y="470" width="1060" height="110" rx="10" fill="#1c1c1c" fill-opacity="0.05" stroke="#1c1c1c" stroke-width="1.2"/>
<text x="590" y="502" text-anchor="middle" font-size="13.5" fill="#2a2a2a">Fundir os três estados é o erro mais caro da base: tratar todo vazio como ausência</text>
<text x="590" y="526" text-anchor="middle" font-size="13.5" fill="#2a2a2a">infla a estatística de dado faltante por um fator de 1,8× a 5,7× conforme o ano (internals §4) —</text>
<text x="590" y="550" text-anchor="middle" font-size="13.5" fill="#2a2a2a">e imputar por cima disso inventa pacientes. O Prata separa; quem funde é decisão do Ouro, declarada.</text>
<defs><marker id="arr2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8a8177"/></marker></defs>
</svg>
