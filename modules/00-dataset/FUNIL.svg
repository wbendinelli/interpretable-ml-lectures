<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 810" role="img" aria-labelledby="title desc" font-family="Satoshi, Inter, Arial, sans-serif">
<title id="title">Vazio, ignorado e não aplicável são estados diferentes</title>
<desc id="desc">Esquema da regra de aplicabilidade das comorbidades. FATOR_RISC igual a 1 ou S habilita o bloco segundo o contrato. O valor vazio gera ausente ou não aplicável conforme o portão. Código 9 gera ignorado; os demais valores não vazios permanecem preenchidos.</desc>
<rect width="1180" height="810" fill="#FFFFFF"/>
<text x="36" y="35" font-size="14" fill="#606460" font-weight="500" text-anchor="start">SAPIANS  /  DADOS DO CURSO</text>
<text x="36" y="78" font-size="30" fill="#212322" font-weight="500" text-anchor="start">O mesmo vazio pode ter significados diferentes</text>
<text x="36" y="110" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Exemplo do contrato Silver · aplicabilidade e valor são verificados separadamente</text>
<rect x="36" y="150" width="352" height="160" rx="8" fill="#F2F3F3" stroke="#D9DCDA"/>
<text x="60" y="184" font-size="17" fill="#212322" font-weight="500" text-anchor="start">PORTÃO  /  FATOR_RISC</text>
<text x="60" y="222" font-size="20" fill="#212322" font-weight="500" text-anchor="start">1 ou S → bloco aplicável</text>
<text x="60" y="255" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Outros valores → não aplicável</text>
<text x="60" y="283" font-size="15" fill="#606460" font-weight="400" text-anchor="start">Regra do contrato, não diagnóstico clínico.</text>
<rect x="470" y="150" width="674" height="160" rx="8" fill="#F2F3F3" stroke="#D9DCDA"/>
<text x="494" y="184" font-size="17" fill="#212322" font-weight="500" text-anchor="start">13 CAMPOS DE COMORBIDADES</text>
<text x="494" y="220" font-size="18" fill="#606460" font-weight="400" text-anchor="start">CARDIOPATI · DIABETES · ASMA · RENAL · OBESIDADE…</text>
<text x="494" y="251" font-size="18" fill="#606460" font-weight="400" text-anchor="start">O valor original permanece disponível.</text>
<text x="494" y="282" font-size="18" fill="#606460" font-weight="400" text-anchor="start">Cada campo recebe sua classificação em uma coluna _estado.</text>
<path d="M404 230 h48 m-8 -6 l8 6 -8 6" fill="none" stroke="#212322" stroke-width="2"/>
<text x="36" y="358" font-size="21" fill="#212322" font-weight="500" text-anchor="start">Quando o campo está vazio</text>
<rect x="36" y="382" width="356" height="179" rx="8" fill="#FFFFFF" stroke="#D9DCDA"/>
<text x="56" y="418" font-size="22" fill="#212322" font-weight="500" text-anchor="start">nao_aplicavel</text>
<text x="56" y="454" font-size="17" fill="#212322" font-weight="500" text-anchor="start">Vazio + portão desligado</text>
<text x="56" y="495" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Não é ausência de um campo</text>
<text x="56" y="522" font-size="17" fill="#606460" font-weight="400" text-anchor="start">considerado aplicável pela regra.</text>
<rect x="412" y="382" width="356" height="179" rx="8" fill="#FFFFFF" stroke="#D9DCDA"/>
<text x="432" y="418" font-size="22" fill="#212322" font-weight="500" text-anchor="start">ausente</text>
<text x="432" y="454" font-size="17" fill="#212322" font-weight="500" text-anchor="start">Vazio + portão habilitado</text>
<text x="432" y="495" font-size="17" fill="#606460" font-weight="400" text-anchor="start">O campo era aplicável,</text>
<text x="432" y="522" font-size="17" fill="#606460" font-weight="400" text-anchor="start">mas não tem valor registrado.</text>
<rect x="788" y="382" width="356" height="179" rx="8" fill="#FFFFFF" stroke="#D9DCDA"/>
<text x="808" y="418" font-size="22" fill="#212322" font-weight="500" text-anchor="start">ignorado</text>
<text x="808" y="454" font-size="17" fill="#212322" font-weight="500" text-anchor="start">Código 9 explícito</text>
<text x="808" y="495" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Há um registro de ignorado;</text>
<text x="808" y="522" font-size="17" fill="#606460" font-weight="400" text-anchor="start">não é o mesmo que uma célula vazia.</text>
<text x="808" y="358" font-size="21" fill="#212322" font-weight="500" text-anchor="start">Quando há código explícito</text>
<rect x="36" y="592" width="1108" height="132" rx="8" fill="#F2F3F3" stroke="#D9DCDA"/>
<text x="60" y="627" font-size="23" fill="#212322" font-weight="500" text-anchor="start">Preservar primeiro; decidir a codificação depois.</text>
<text x="60" y="663" font-size="19" fill="#606460" font-weight="400" text-anchor="start">Silver separa esses estados. Gold declara quais são fundidos nas entradas do modelo.</text>
<text x="60" y="694" font-size="18" fill="#606460" font-weight="400" text-anchor="start">Outro valor não vazio fica como preenchido; o domínio é verificado separadamente.</text>
<text x="36" y="763" font-size="16" fill="#606460" font-weight="400" text-anchor="start">Fonte: srag_30_silver.py · missing_state e GATES · leitura: Silver walkthrough §3 e internals §4</text>
<text x="36" y="790" font-size="16" fill="#606460" font-weight="400" text-anchor="start">O esquema explica a regra de tratamento; não representa uma contagem ou um efeito sobre o desfecho.</text>
</svg>
