<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Georgia, serif" font-size="14">
<rect width="1180" height="760" fill="#faf7f2"/>
<text x="590.0" y="34" text-anchor="middle" font-size="22" fill="#222">SRAG / SIVEP-Gripe — o tratamento, do Bronze ao Ouro</text>
<text x="590.0" y="56" text-anchor="middle" font-size="13" fill="#666">4,109,567 notificações · 2019–2024 · estrutura e contagens geradas do contrato; achados citados são impressos por células</text>
<rect x="20" y="84" width="350" height="656" rx="10" fill="#ffffff" stroke="#b8b0a4" stroke-width="1.5"/>
<text x="195.0" y="114" text-anchor="middle" font-size="19" fill="#1c1c1c" font-weight="bold">Bronze</text>
<text x="195.0" y="134" text-anchor="middle" font-size="12.5" fill="#777">o download, byte a byte, nunca alterado</text>
<rect x="36" y="152" width="318" height="78" rx="7" fill="#7a6a55" fill-opacity="0.09" stroke="#7a6a55" stroke-width="1.4"/>
<text x="48" y="174" font-size="13.5" font-weight="bold" fill="#7a6a55">194 colunas × 6 arquivos anuais</text>
<text x="48" y="194" font-size="12" fill="#3a3a3a">reexportação de 26/06/2025, um layout</text>
<text x="48" y="211" font-size="12" fill="#3a3a3a">4,109,567 linhas, ~2,2 GB de parquet</text>
<rect x="36" y="242" width="318" height="112" rx="7" fill="#7a6a55" fill-opacity="0.09" stroke="#7a6a55" stroke-width="1.4"/>
<text x="48" y="264" font-size="13.5" font-weight="bold" fill="#7a6a55">o que o perfil mediu</text>
<text x="48" y="284" font-size="12" fill="#3a3a3a">75 colunas mudam de forma entre anos</text>
<text x="48" y="301" font-size="12" fill="#3a3a3a">('1' vs '1.0' — uma regra literal perde</text>
<text x="48" y="318" font-size="12" fill="#3a3a3a">519.518 positivos de PCR_SARS2 em 2020)</text>
<text x="48" y="335" font-size="12" fill="#3a3a3a">21 colunas 100% vazias em algum ano</text>
<rect x="36" y="366" width="318" height="112" rx="7" fill="#7a6a55" fill-opacity="0.09" stroke="#7a6a55" stroke-width="1.4"/>
<text x="48" y="388" font-size="13.5" font-weight="bold" fill="#7a6a55">sujeira, mantida visível</text>
<text x="48" y="408" font-size="12" fill="#3a3a3a">7 linhas deslocadas (UTI carrega nome</text>
<text x="48" y="425" font-size="12" fill="#3a3a3a">de hospital) → quarentena, nenhuma some</text>
<text x="48" y="442" font-size="12" fill="#3a3a3a">datas como 1695-06-14 02:32:37,74…</text>
<text x="48" y="459" font-size="12" fill="#3a3a3a">20 linhas com idade declarada negativa</text>
<rect x="36" y="490" width="318" height="95" rx="7" fill="#7a6a55" fill-opacity="0.09" stroke="#7a6a55" stroke-width="1.4"/>
<text x="48" y="512" font-size="13.5" font-weight="bold" fill="#7a6a55">procedência</text>
<text x="48" y="532" font-size="12" fill="#3a3a3a">S3 do dadosabertos (o portal caiu;</text>
<text x="48" y="549" font-size="12" fill="#3a3a3a">o bucket ficou de pé)</text>
<text x="48" y="566" font-size="12" fill="#3a3a3a">referência: o script MIT do Ministério</text>
<rect x="410" y="84" width="350" height="656" rx="10" fill="#ffffff" stroke="#b8b0a4" stroke-width="1.5"/>
<text x="585.0" y="114" text-anchor="middle" font-size="19" fill="#1c1c1c" font-weight="bold">Prata (Silver)</text>
<text x="585.0" y="134" text-anchor="middle" font-size="12.5" fill="#777">fatos sobre o registro — nenhuma escolha de tarefa</text>
<rect x="426" y="152" width="318" height="95" rx="7" fill="#2e7d52" fill-opacity="0.09" stroke="#2e7d52" stroke-width="1.4"/>
<text x="438" y="174" font-size="13.5" font-weight="bold" fill="#2e7d52">contrato: 13 famílias, 194/194 com regra</text>
<text x="438" y="194" font-size="12" fill="#3a3a3a">COLUMNS.md gerado + verificado no build;</text>
<text x="438" y="211" font-size="12" fill="#3a3a3a">pre-commit re-renderiza e diffa</text>
<text x="438" y="228" font-size="12" fill="#3a3a3a">normalise() antes de ler qualquer domínio</text>
<rect x="426" y="259" width="318" height="95" rx="7" fill="#2e7d52" fill-opacity="0.09" stroke="#2e7d52" stroke-width="1.4"/>
<text x="438" y="281" font-size="13.5" font-weight="bold" fill="#2e7d52">portões: 34 confirmados, 14 rejeitados</text>
<text x="438" y="301" font-size="12" fill="#3a3a3a">regra-G: ≤0,05% de contradição, cada ano</text>
<text x="438" y="318" font-size="12" fill="#3a3a3a">build() re-mede e se recusa se divergir</text>
<text x="438" y="335" font-size="12" fill="#3a3a3a">3 estados do vazio, nunca fundidos</text>
<rect x="426" y="366" width="318" height="95" rx="7" fill="#2e7d52" fill-opacity="0.09" stroke="#2e7d52" stroke-width="1.4"/>
<text x="438" y="388" font-size="13.5" font-weight="bold" fill="#2e7d52">226 colunas derivadas (→ 420)</text>
<text x="438" y="408" font-size="12" fill="#3a3a3a">semana MMWR (100,00% vs SEM_PRI),</text>
<text x="438" y="425" font-size="12" fill="#3a3a3a">catálogo de etiologia completo (2,1×),</text>
<text x="438" y="442" font-size="12" fill="#3a3a3a">fabricante de vacina, IBGE, idade</text>
<rect x="426" y="473" width="318" height="132" rx="7" fill="#4a7fb5" fill-opacity="0.09" stroke="#4a7fb5" stroke-width="1.4"/>
<text x="438" y="495" font-size="13.5" font-weight="bold" fill="#4a7fb5">toda coluna com classe</text>
<text x="438" y="515" font-size="12" fill="#3a3a3a">ok 126 · par nome-código 17 · texto livre 21</text>
<text x="438" y="532" font-size="12" fill="#3a3a3a">year-gated 9 · identificador 10 · vazamento 11</text>
<text x="438" y="549" font-size="12" fill="#3a3a3a">84 checagens Kahn — as que falham são</text>
<text x="438" y="566" font-size="12" fill="#3a3a3a">documentação (RES_AN⇢agente: 9–20%/ano)</text>
<text x="438" y="583" font-size="12" fill="#3a3a3a">invariante: 4.109.560 + 7 = tudo</text>
<rect x="800" y="84" width="350" height="656" rx="10" fill="#ffffff" stroke="#b8b0a4" stroke-width="1.5" stroke-dasharray="7,5"/>
<text x="975.0" y="114" text-anchor="middle" font-size="19" fill="#1c1c1c" font-weight="bold">Ouro (Gold)</text>
<text x="975.0" y="134" text-anchor="middle" font-size="12.5" fill="#777">escolhas de tarefa — abertas de propósito</text>
<rect x="816" y="152" width="318" height="95" rx="7" fill="#c03434" fill-opacity="0.09" stroke="#c03434" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="828" y="174" font-size="13.5" font-weight="bold" fill="#c03434">alvo (decisão: William + curso)</text>
<text x="828" y="194" font-size="12" fill="#3a3a3a">candidatos: óbito · UTI · ventilação</text>
<text x="828" y="211" font-size="12" fill="#3a3a3a">EVOLUCAO é rótulo, nunca feature</text>
<text x="828" y="228" font-size="12" fill="#3a3a3a">GOLD.md põe o cardápio com evidência</text>
<rect x="816" y="259" width="318" height="95" rx="7" fill="#c03434" fill-opacity="0.09" stroke="#c03434" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="828" y="281" font-size="13.5" font-weight="bold" fill="#c03434">exclusão por vazamento — gerável (11+39)</text>
<text x="828" y="301" font-size="12" fill="#3a3a3a">11 colunas cruas classe vazamento +</text>
<text x="828" y="318" font-size="12" fill="#3a3a3a">39 derivadas (_obito*, dias_*, caso_srag_ms)</text>
<text x="828" y="335" font-size="12" fill="#3a3a3a">gerada de COLUMN_CLASS, não digitada</text>
<rect x="816" y="366" width="318" height="95" rx="7" fill="#c03434" fill-opacity="0.09" stroke="#c03434" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="828" y="388" font-size="13.5" font-weight="bold" fill="#c03434">coorte e anos</text>
<text x="828" y="408" font-size="12" fill="#3a3a3a">coorte_hospitalizado vs SRAG inteira</text>
<text x="828" y="425" font-size="12" fill="#3a3a3a">vs covid_caso — a deriva de regime é</text>
<text x="828" y="442" font-size="12" fill="#3a3a3a">contexto: letalidade 29→8,6%</text>
<rect x="816" y="473" width="318" height="112" rx="7" fill="#c03434" fill-opacity="0.09" stroke="#c03434" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="828" y="495" font-size="13.5" font-weight="bold" fill="#c03434">codificação e split</text>
<text x="828" y="515" font-size="12" fill="#3a3a3a">3 estados do vazio → categorias, nunca</text>
<text x="828" y="532" font-size="12" fill="#3a3a3a">imputados em silêncio; colunas year-gated</text>
<text x="828" y="549" font-size="12" fill="#3a3a3a">são calendários disfarçados; proposta de</text>
<text x="828" y="566" font-size="12" fill="#3a3a3a">split temporal no GOLD.md</text>
<path d="M 374 380.0 L 400 380.0" stroke="#8a8177" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M 764 380.0 L 790 380.0" stroke="#8a8177" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8a8177"/></marker></defs>
</svg>
