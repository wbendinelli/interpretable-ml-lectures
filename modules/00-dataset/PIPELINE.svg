<text x="146" y="828" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#8a6d9b">Modelo do curso</text>
<text x="146" y="848" text-anchor="middle" font-size="11.5" fill="#6b6b6b">o objeto que os módulos</text>
<text x="146" y="864" text-anchor="middle" font-size="11.5" fill="#6b6b6b">01–05 explicam</text>
<text x="146" y="894" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2a2a2a">AUC teste 0,7644</text>
<text x="146" y="913" text-anchor="middle" font-size="11" fill="#6b6b6b">XGBoost 0,05 / 4 / 800</text>
<rect x="278" y="808" width="281" height="114" rx="8" fill="#8a6d9b" fill-opacity="0.05" stroke="#8a6d9b" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="291" y="828" font-size="13" font-weight="bold" fill="#8a6d9b">XGBoost tunado</text>
<text x="291" y="849" font-size="12" fill="#3a3a3a">800 árvores, profundidade 4, lr 0,05</text>
<text x="291" y="866" font-size="12" fill="#3a3a3a">min_child_weight 100 · reg_lambda 5</text>
<text x="291" y="883" font-size="12" fill="#3a3a3a">categóricas nativas, hist, semente 42</text>
<text x="291" y="900" font-size="12" fill="#3a3a3a">AUC val 0,7564 · Brier 0,1308 no teste</text>
<rect x="573" y="808" width="281" height="114" rx="8" fill="#8a6d9b" fill-opacity="0.05" stroke="#8a6d9b" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="586" y="828" font-size="13" font-weight="bold" fill="#8a6d9b">logística de contraste</text>
<text x="586" y="849" font-size="12" fill="#3a3a3a">linear em log-odds, o baseline</text>
<text x="586" y="866" font-size="12" fill="#3a3a3a">interpretável que o curso compara</text>
<text x="586" y="883" font-size="12" fill="#3a3a3a">AUC val 0,7206 · teste 0,7246</text>
<text x="586" y="900" font-size="12" fill="#3a3a3a">mesmo Ouro, mesma amostra, outra forma</text>
<rect x="868" y="808" width="281" height="114" rx="8" fill="#8a6d9b" fill-opacity="0.05" stroke="#8a6d9b" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="881" y="828" font-size="13" font-weight="bold" fill="#8a6d9b">a consequência, cumprida</text>
<text x="881" y="849" font-size="12" fill="#3a3a3a">XGB_PARAMS na data: 0,08 / 5 / 400</text>
<text x="881" y="866" font-size="12" fill="#3a3a3a">vencedor adotado: 0,05 / 4 / 800</text>
<text x="881" y="883" font-size="12" fill="#3a3a3a">o modelo do curso mudou (MODEL.md)</text>
<text x="881" y="900" font-size="12" fill="#3a3a3a">módulos 01–05 re-sincronizados depois</text>
