<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1070" role="img" aria-labelledby="title desc" font-family="Satoshi, Inter, Arial, sans-serif">
<title id="title">Da notificação ao preditor das aulas</title>
<desc id="desc">Cinco etapas: origem preservada, tratamento, tarefa Gold, seleção histórica por AUC e referência explicada nas aulas. As comparações posteriores não substituem automaticamente a referência.</desc>
<rect width="1180" height="1070" fill="#FFFFFF"/>
<text x="36" y="35" font-size="14" fill="#606460" font-weight="500" text-anchor="start">SAPIANS  /  DADOS DO CURSO</text>
<text x="36" y="78" font-size="30" fill="#212322" font-weight="500" text-anchor="start">Da notificação ao preditor das aulas</text>
<text x="36" y="110" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Origem, decisões e referência publicada · números dos registros versionados</text>
<rect x="36" y="145" width="1108" height="140" rx="8" fill="#F2F3F3" stroke="#D9DCDA"/>
<rect x="56" y="166" width="172" height="36" rx="8" fill="#212322" stroke="#212322"/>
<text x="142" y="190" font-size="16" fill="#FFFFFF" font-weight="500" text-anchor="middle">BRONZE</text>
<text x="250" y="179" font-size="22" fill="#212322" font-weight="500" text-anchor="start">Preservar a origem</text>
<text x="250" y="209" font-size="17" fill="#606460" font-weight="400" text-anchor="start">4.109.567 notificações · 194 campos na união da série</text>
<text x="250" y="235" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Anos 2019–2024 · extração 26-06-2025</text>
<text x="250" y="261" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Arquivos anuais preservados; a unidade é a notificação, não a pessoa.</text>
<path d="M142 289 v10 m-5 -5 l5 5 5 -5" fill="none" stroke="#606460" stroke-width="2"/>
<rect x="36" y="305" width="1108" height="140" rx="8" fill="#F2F3F3" stroke="#D9DCDA"/>
<rect x="56" y="326" width="172" height="36" rx="8" fill="#212322" stroke="#212322"/>
<text x="142" y="350" font-size="16" fill="#FFFFFF" font-weight="500" text-anchor="middle">SILVER</text>
<text x="250" y="339" font-size="22" fill="#212322" font-weight="500" text-anchor="start">Tratar a forma e registrar as regras</text>
<text x="250" y="369" font-size="17" fill="#606460" font-weight="400" text-anchor="start">420 colunas = 194 originais + 226 derivadas</text>
<text x="250" y="395" font-size="17" fill="#606460" font-weight="400" text-anchor="start">34 portões no contrato · 13 famílias de campos</text>
<text x="250" y="421" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Estados do vazio e anomalias ficam explícitos; a linha não é reparada em silêncio.</text>
<path d="M142 449 v10 m-5 -5 l5 5 5 -5" fill="none" stroke="#606460" stroke-width="2"/>
<rect x="36" y="465" width="1108" height="140" rx="8" fill="#F2F3F3" stroke="#D9DCDA"/>
<rect x="56" y="486" width="172" height="36" rx="8" fill="#212322" stroke="#212322"/>
<text x="142" y="510" font-size="16" fill="#FFFFFF" font-weight="500" text-anchor="middle">GOLD</text>
<text x="250" y="499" font-size="22" fill="#212322" font-weight="500" text-anchor="start">Definir a tarefa retrospectiva</text>
<text x="250" y="529" font-size="17" fill="#606460" font-weight="400" text-anchor="start">1.282.970 notificações elegíveis · 40 entradas do modelo</text>
<text x="250" y="555" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Coorte hospitalizada + definição COVID ampla + desfecho registrado de cura ou óbito</text>
<text x="250" y="581" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Treino elegível: 1.242.680 · amostra usada: 200.000</text>
<path d="M142 609 v10 m-5 -5 l5 5 5 -5" fill="none" stroke="#606460" stroke-width="2"/>
<rect x="36" y="625" width="1108" height="140" rx="8" fill="#F2F3F3" stroke="#D9DCDA"/>
<rect x="56" y="646" width="172" height="36" rx="8" fill="#212322" stroke="#212322"/>
<text x="142" y="670" font-size="16" fill="#FFFFFF" font-weight="500" text-anchor="middle">SELEÇÃO</text>
<text x="250" y="659" font-size="22" fill="#212322" font-weight="500" text-anchor="start">Registrar a escolha histórica por AUC</text>
<text x="250" y="689" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Validação 2023: 24.148 notificações · líder xgb</text>
<text x="250" y="715" font-size="17" fill="#606460" font-weight="400" text-anchor="start">AUC de validação: 0,7564 · teste histórico: 2024</text>
<text x="250" y="741" font-size="17" fill="#606460" font-weight="400" text-anchor="start">O teste é excluído da função de escolha; suas leituras atuais são exploratórias.</text>
<path d="M142 769 v10 m-5 -5 l5 5 5 -5" fill="none" stroke="#606460" stroke-width="2"/>
<rect x="36" y="785" width="1108" height="140" rx="8" fill="#F2F3F3" stroke="#D9DCDA"/>
<rect x="56" y="806" width="172" height="36" rx="8" fill="#212322" stroke="#212322"/>
<text x="142" y="830" font-size="16" fill="#FFFFFF" font-weight="500" text-anchor="middle">REFERÊNCIA</text>
<text x="250" y="819" font-size="22" fill="#212322" font-weight="500" text-anchor="start">Explicar o preditor adotado nas aulas</text>
<text x="250" y="849" font-size="17" fill="#606460" font-weight="400" text-anchor="start">XGBoost · 800 árvores · profundidade 4 · taxa 0,05</text>
<text x="250" y="875" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Teste 2024: AUC 0,7644 · Brier 0,1308</text>
<text x="250" y="901" font-size="17" fill="#606460" font-weight="400" text-anchor="start">As explicações locais e globais escolhem exemplares e apoios conforme cada método.</text>
<text x="36" y="989" font-size="19" fill="#212322" font-weight="500" text-anchor="start">Leitura: README → manifesto Gold → caderno do modelo → módulos de método.</text>
<text x="36" y="1020" font-size="17" fill="#606460" font-weight="400" text-anchor="start">Comparações posteriores por log loss: COURSE_STUDY.md. Não há substituição automática do modelo.</text>
<text x="36" y="1048" font-size="14" fill="#606460" font-weight="400" text-anchor="start">Fontes: PROFILE.json · contrato Silver · gold/counts.json · selection_metrics.json · model_metrics.json</text>
</svg>
