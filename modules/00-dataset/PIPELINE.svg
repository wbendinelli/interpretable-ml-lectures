<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 954" font-family="Georgia, serif" font-size="14">
<rect width="1180" height="954" fill="#faf7f2"/>
<text x="590.0" y="34" text-anchor="middle" font-size="22" fill="#222">SRAG / SIVEP-Gripe — do download bruto ao modelo do curso</text>
<text x="590.0" y="58" text-anchor="middle" font-size="13" fill="#666">Bronze intocado → Prata afirma fatos → Ouro escolhe (decidido 2026-09-01) → o estudo mede → o modelo é adotado</text>
<text x="590.0" y="78" text-anchor="middle" font-size="11.5" fill="#8a8177">gerado de PROFILE.json, gold/counts.json, gold/selection_metrics.json e gold/model_metrics.json — nenhuma métrica digitada</text>
<rect x="20" y="98" width="1140" height="142" rx="12" fill="#ffffff" stroke="#b8b0a4" stroke-width="1.4"/>
<rect x="32" y="110" width="228" height="118" rx="9" fill="#7a6a55" fill-opacity="0.11" stroke="#7a6a55" stroke-width="1.3"/>
<text x="146" y="132" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#7a6a55">Bronze</text>
<text x="146" y="152" text-anchor="middle" font-size="11.5" fill="#6b6b6b">o download, byte a byte,</text>
<text x="146" y="168" text-anchor="middle" font-size="11.5" fill="#6b6b6b">nunca alterado</text>
<text x="146" y="198" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2a2a2a">194 colunas × 6 anos</text>
<text x="146" y="217" text-anchor="middle" font-size="11" fill="#6b6b6b">reexportação de 26/06/2025</text>
<rect x="278" y="112" width="281" height="114" rx="8" fill="#7a6a55" fill-opacity="0.05" stroke="#7a6a55" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="291" y="132" font-size="13" font-weight="bold" fill="#7a6a55">um layout, seis arquivos</text>
<text x="291" y="153" font-size="12" fill="#3a3a3a">4.109.567 notificações, 2019–2024</text>
<text x="291" y="170" font-size="12" fill="#3a3a3a">pico em 2021: 1.745.672 linhas</text>
<text x="291" y="187" font-size="12" fill="#3a3a3a">um só layout, nenhuma coluna renomeada</text>
<text x="291" y="204" font-size="12" fill="#3a3a3a">S3 do dadosabertos, script MIT do MS</text>
<rect x="573" y="112" width="281" height="114" rx="8" fill="#7a6a55" fill-opacity="0.05" stroke="#7a6a55" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="586" y="132" font-size="13" font-weight="bold" fill="#7a6a55">o que o perfil mediu</text>
<text x="586" y="153" font-size="12" fill="#3a3a3a">75 colunas mudam de forma entre anos</text>
<text x="586" y="170" font-size="12" fill="#3a3a3a">('1' vs '1.0' — a regra literal perde</text>
<text x="586" y="187" font-size="12" fill="#3a3a3a">519.518 positivos de PCR_SARS2 em 2020)</text>
<text x="586" y="204" font-size="12" fill="#3a3a3a">21 colunas 100% vazias em algum ano</text>
<rect x="868" y="112" width="281" height="114" rx="8" fill="#7a6a55" fill-opacity="0.05" stroke="#7a6a55" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="881" y="132" font-size="13" font-weight="bold" fill="#7a6a55">sujeira, mantida visível</text>
<text x="881" y="153" font-size="12" fill="#3a3a3a">7 linhas deslocadas (UTI carrega</text>
<text x="881" y="170" font-size="12" fill="#3a3a3a">nome de hospital) → quarentena</text>
<text x="881" y="187" font-size="12" fill="#3a3a3a">datas como 1695-06-14 02:32:37,74…</text>
<text x="881" y="204" font-size="12" fill="#3a3a3a">20 idades declaradas negativas</text>
<path d="M 146 244 L 146 264" stroke="#8a8177" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="20" y="272" width="1140" height="142" rx="12" fill="#ffffff" stroke="#b8b0a4" stroke-width="1.4"/>
<rect x="32" y="284" width="228" height="118" rx="9" fill="#2e7d52" fill-opacity="0.11" stroke="#2e7d52" stroke-width="1.3"/>
<text x="146" y="306" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2e7d52">Prata (Silver)</text>
<text x="146" y="326" text-anchor="middle" font-size="11.5" fill="#6b6b6b">fatos sobre o registro —</text>
<text x="146" y="342" text-anchor="middle" font-size="11.5" fill="#6b6b6b">nenhuma escolha de tarefa</text>
<text x="146" y="372" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2a2a2a">4.109.567 × 420</text>
<text x="146" y="391" text-anchor="middle" font-size="11" fill="#6b6b6b">7 linhas em quarentena, contadas</text>
<rect x="278" y="286" width="281" height="114" rx="8" fill="#2e7d52" fill-opacity="0.05" stroke="#2e7d52" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="291" y="306" font-size="13" font-weight="bold" fill="#2e7d52">contrato: 13 famílias</text>
<text x="291" y="327" font-size="12" fill="#3a3a3a">194/194 colunas com regra escrita</text>
<text x="291" y="344" font-size="12" fill="#3a3a3a">COLUMNS.md gerado e verificado no build</text>
<text x="291" y="361" font-size="12" fill="#3a3a3a">pre-commit re-renderiza e diffa</text>
<text x="291" y="378" font-size="12" fill="#3a3a3a">normalise() antes de ler um domínio</text>
<rect x="573" y="286" width="281" height="114" rx="8" fill="#2e7d52" fill-opacity="0.05" stroke="#2e7d52" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="586" y="306" font-size="13" font-weight="bold" fill="#2e7d52">portões: 34 confirmados, 14 fora</text>
<text x="586" y="327" font-size="12" fill="#3a3a3a">regra-G: ≤0,05% de contradição, cada ano</text>
<text x="586" y="344" font-size="12" fill="#3a3a3a">build() re-mede e se recusa se divergir</text>
<text x="586" y="361" font-size="12" fill="#3a3a3a">3 estados do vazio, nunca fundidos</text>
<text x="586" y="378" font-size="12" fill="#3a3a3a">84 checagens Kahn: o que falha é doc.</text>
<rect x="868" y="286" width="281" height="114" rx="8" fill="#2e7d52" fill-opacity="0.05" stroke="#2e7d52" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="881" y="306" font-size="13" font-weight="bold" fill="#2e7d52">226 colunas derivadas</text>
<text x="881" y="327" font-size="12" fill="#3a3a3a">semana MMWR, etiologia completa (2,1×),</text>
<text x="881" y="344" font-size="12" fill="#3a3a3a">fabricante de vacina, IBGE, idade</text>
<text x="881" y="361" font-size="12" fill="#3a3a3a">ok 126 · vazamento 11 · year-gated 9</text>
<text x="881" y="378" font-size="12" fill="#3a3a3a">código-nome 17 · texto 21 · id 10</text>
<path d="M 146 418 L 146 438" stroke="#8a8177" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="20" y="446" width="1140" height="142" rx="12" fill="#ffffff" stroke="#b8b0a4" stroke-width="1.4"/>
<rect x="32" y="458" width="228" height="118" rx="9" fill="#b58a3e" fill-opacity="0.11" stroke="#b58a3e" stroke-width="1.3"/>
<text x="146" y="480" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#b58a3e">Ouro (Gold)</text>
<text x="146" y="500" text-anchor="middle" font-size="11.5" fill="#6b6b6b">as cinco escolhas de tarefa,</text>
<text x="146" y="516" text-anchor="middle" font-size="11.5" fill="#6b6b6b">decididas em 2026-09-01</text>
<text x="146" y="546" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2a2a2a">1.282.970 × 40 features</text>
<text x="146" y="565" text-anchor="middle" font-size="11" fill="#6b6b6b">alvo y_obito · 31,04% de óbitos</text>
<rect x="278" y="460" width="281" height="114" rx="8" fill="#b58a3e" fill-opacity="0.05" stroke="#b58a3e" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="291" y="480" font-size="13" font-weight="bold" fill="#b58a3e">alvo e vazamento</text>
<text x="291" y="501" font-size="12" fill="#3a3a3a">óbito nos casos fechados → y_obito</text>
<text x="291" y="518" font-size="12" fill="#3a3a3a">398.286 óbitos em 1.282.970 linhas</text>
<text x="291" y="535" font-size="12" fill="#3a3a3a">EVOLUCAO é rótulo, nunca feature</text>
<text x="291" y="552" font-size="12" fill="#3a3a3a">exclusão gerada: 11 cruas + 39 derivadas</text>
<rect x="573" y="460" width="281" height="114" rx="8" fill="#b58a3e" fill-opacity="0.05" stroke="#b58a3e" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="586" y="480" font-size="13" font-weight="bold" fill="#b58a3e">coorte e janela</text>
<text x="586" y="501" font-size="12" fill="#3a3a3a">2.428.695 hospitalizados</text>
<text x="586" y="518" font-size="12" fill="#3a3a3a">1.364.487 com COVID (definição ampla)</text>
<text x="586" y="535" font-size="12" fill="#3a3a3a">1.283.801 fechados → 1.282.970</text>
<text x="586" y="552" font-size="12" fill="#3a3a3a">janela desde 2020-02-26</text>
<rect x="868" y="460" width="281" height="114" rx="8" fill="#b58a3e" fill-opacity="0.05" stroke="#b58a3e" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="881" y="480" font-size="13" font-weight="bold" fill="#b58a3e">split temporal</text>
<text x="881" y="501" font-size="12" fill="#3a3a3a">treino ≤ 2022-12-31: 1.242.680 (31,4%)</text>
<text x="881" y="518" font-size="12" fill="#3a3a3a">validação 2023: 24.148 (18,9%)</text>
<text x="881" y="535" font-size="12" fill="#3a3a3a">teste 2024: 16.142 (18,2%)</text>
<text x="881" y="552" font-size="12" fill="#3a3a3a">os três vazios viram categoria declarada</text>
