<text x="146" y="654" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#4a7fb5">Estudo de seleção</text>
<text x="146" y="674" text-anchor="middle" font-size="11.5" fill="#6b6b6b">protocolo pré-registrado,</text>
<text x="146" y="690" text-anchor="middle" font-size="11.5" fill="#6b6b6b">escolha só na validação</text>
<text x="146" y="720" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2a2a2a">6 candidatos · 73 configs</text>
<text x="146" y="739" text-anchor="middle" font-size="11" fill="#6b6b6b">vencedor: xgb</text>
<rect x="278" y="634" width="281" height="114" rx="8" fill="#4a7fb5" fill-opacity="0.05" stroke="#4a7fb5" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="291" y="654" font-size="13" font-weight="bold" fill="#4a7fb5">o critério, escrito antes</text>
<text x="291" y="675" font-size="12" fill="#3a3a3a">primário: AUC-ROC na validação 2023</text>
<text x="291" y="692" font-size="12" fill="#3a3a3a">empate: 1 EP de bootstrap pareado</text>
<text x="291" y="709" font-size="12" fill="#3a3a3a">(200 reamostras, semente 42)</text>
<text x="291" y="726" font-size="12" fill="#3a3a3a">consequência declarada na regra 8</text>
<rect x="573" y="634" width="281" height="114" rx="8" fill="#4a7fb5" fill-opacity="0.05" stroke="#4a7fb5" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="586" y="654" font-size="13" font-weight="bold" fill="#4a7fb5">o zoo e o orçamento</text>
<text x="586" y="675" font-size="12" fill="#3a3a3a">dummy · lpm · logit · árvore ·</text>
<text x="586" y="692" font-size="12" fill="#3a3a3a">floresta · xgb — três matrizes de X</text>
<text x="586" y="709" font-size="12" fill="#3a3a3a">73 configurações medidas de 1.313</text>
<text x="586" y="726" font-size="12" fill="#3a3a3a">xgb: 30 de 960 · árvore: 24 de 320</text>
<rect x="868" y="634" width="281" height="114" rx="8" fill="#4a7fb5" fill-opacity="0.05" stroke="#4a7fb5" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="881" y="654" font-size="13" font-weight="bold" fill="#4a7fb5">o teste ficou lacrado</text>
<text x="881" y="675" font-size="12" fill="#3a3a3a">pick_model levanta exceção se vir</text>
<text x="881" y="692" font-size="12" fill="#3a3a3a">uma linha de split == test</text>
<text x="881" y="709" font-size="12" fill="#3a3a3a">lido uma vez, depois de escolhido: 0,7644</text>
<text x="881" y="726" font-size="12" fill="#3a3a3a">nenhum candidato a 1 EP do líder</text>
