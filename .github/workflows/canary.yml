# Weekly, non-blocking canary: the walkthrough notebooks on the newest Python
# and unpinned latest packages. The pinned baseline (requirements.lock, CI's
# notebook jobs) is the reproducibility claim and only moves in deliberate
# upgrade PRs (see CONTRIBUTING); this workflow is how the repo knows when the
# latest stack breaks or drifts, without failing anyone's PR. It lives in its
# own workflow so the README can carry its badge — the repo's identity is
# reproducibility, and this is the early-warning light.
name: canary

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, alongside CI's scheduled jobs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x" # newest stable Python
      - name: Install latest, unpinned
        run: pip install -U scikit-learn lime numpy scipy matplotlib jupyter
      - name: Report the stack under test
        run: |
          python --version
          pip list --format=freeze | grep -Ei '^(scikit-learn|lime|numpy|scipy|matplotlib)='
      - name: Execute every walkthrough notebook on the latest stack
        run: |
          set -e
          shopt -s nullglob
          nbs=(modules/*/notebooks/*_walkthrough.ipynb)
          if [ ${#nbs[@]} -eq 0 ]; then echo "no walkthrough notebooks found" >&2; exit 1; fi
          for nb in "${nbs[@]}"; do
            echo "::group::$nb"
            time jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=1200 \
              --output-dir "$RUNNER_TEMP/nbcanary" "$nb"
            echo "::endgroup::"
          done
