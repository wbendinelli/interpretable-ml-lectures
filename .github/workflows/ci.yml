# Four checks, nothing more:
#   links        — relative/intra-repo links on every PR (offline, deterministic);
#                  the full external check runs weekly and files an issue instead
#                  of failing anyone's PR (arXiv/DOI hosts have bad days).
#   checks       — pre-commit (yaml/toml lint, ruff on tools/, codespell,
#                  actionlint, the notebook conventions from CONTRIBUTING) and
#                  the CHANGELOG discipline: a PR that touches modules/,
#                  tools/, .github/ or requirements* must touch CHANGELOG.md
#                  too (escape hatch: the no-changelog label).
#   notebooks    — the walkthrough notebooks must run clean, top to bottom, on the
#                  pinned environment. Output-value comparison is deliberately out
#                  of scope: BLAS/platform drift alone moves the third decimal
#                  between a Linux runner and the macOS box that produced the
#                  committed outputs. The claim enforced here is "the pinned stack
#                  still executes and writes nothing into tracked paths" —
#                  nbconvert output goes to $RUNNER_TEMP and figures to a
#                  git-ignored directory, so the dirty-tree check guards against
#                  a notebook writing anywhere else.
#                  The heavy *_internals notebooks run weekly, on dispatch, or when
#                  a PR touches them.
#                  Scoped on PRs (2026-09-01): a PR executes only the notebooks of
#                  the modules it touches; tools/requirements*/.github changes widen
#                  the walkthrough scope to all modules. Push to main and the weekly
#                  runs still execute everything, so nothing stays unverified for
#                  more than a week.
#   citation     — CITATION.cff stays valid, so the "Cite this repository" button
#                  keeps working.
#
# The weekly latest-stack canary lives in its own workflow (canary.yml) so the
# README can carry its badge.
#
# All third-party actions are pinned to commit SHAs (the tag rides in a
# comment); Dependabot watches the github-actions ecosystem and proposes bumps.
#
# Timeouts were measured locally (Apple Silicon, macOS, re-measured 2026-09-01
# after the COVID rewrite of modules 01-03, pinned Python 3.12 stack), wall
# clock per notebook, fresh kernel:
#   walkthroughs — cp 6 s, ice 6 s, lime 18 s, cf 10 s, shap 8 s,
#                  srag_silver ~40 s (incl. 20 MB download), srag_model
#                  ~8 s on the committed sample (Linux ~2-3x)
#   internals    — cp 21 s, ice 6 s, lime 50 s, cf 9 s, shap 21 s;
#                  srag_silver ~75 s;
#                  srag_model ~47 s local with the Gold on disk (full 1.24M
#                  fit 19.3 s) — on a runner the heavy cells print PULADO
# The BCW-era numbers (lime_internals at 283.8 s) are gone with the rewrite:
# modules 01-03 now run on the committed 2.4 MB sample, no network. CI values
# keep ~3x margin for slower Linux runners and pip install.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly full link check + internals run
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on PRs only — cancelling main-branch runs leaves a
# misleading red X on the commit. The event name is part of the group so the
# weekly scheduled run never queues behind (or cancels) a push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check relative and intra-repo links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # _template holds intentional <placeholder> links
          args: --offline --no-progress --include-fragments --exclude-path modules/_template "**/*.md" CITATION.cff
          fail: true

  checks:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: pip install pre-commit
      - name: pre-commit (lint, notebook conventions)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Notable changes must touch CHANGELOG.md
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx "no-changelog"; then
            echo "no-changelog label set — skipping"
            exit 0
          fi
          files=$(gh pr view "$PR" --json files --jq '.files[].path')
          if echo "$files" | grep -qE '^(modules/|tools/|\.github/|requirements)' \
             && ! echo "$files" | grep -qx 'CHANGELOG.md'; then
            echo "This PR changes modules/, tools/, .github/ or requirements* without a CHANGELOG.md line." >&2
            echo "Add one (what changed and why it matters), or apply the 'no-changelog' label if truly not notable." >&2
            exit 1
          fi
          echo "CHANGELOG requirement satisfied"

  links-external:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check all links, external included
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 403: dl.acm.org (and friends) refuse CI user agents for links that
          # open fine in a browser — a 403 here is noise, not a broken link.
          args: --no-progress --max-retries 2 --accept 200,206,403,429 --exclude-path modules/_template "**/*.md" "**/*.ipynb" CITATION.cff
          fail: false
      - name: Find the open tracking issue, if one exists
        if: steps.lychee.outputs.exit_code != 0
        id: find-issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --search 'in:title "Broken links (weekly check)"' \
                --json number,title \
                --jq '[.[] | select(.title == "Broken links (weekly check)")][0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - name: File or update the tracking issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Broken links (weekly check)"
          content-filepath: ./lychee/out.md
          labels: content
          issue-number: ${{ steps.find-issue.outputs.number }}

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
    outputs:
      # 'all', or a JSON list of module dirs whose walkthroughs the PR must run
      walkthroughs: ${{ steps.scope.outputs.walkthroughs }}
      # JSON list of module dirs whose internals the PR touched
      internals: ${{ steps.scope.outputs.internals }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A change under tools/, requirements* or .github/ can affect every
          # notebook, so it widens the walkthrough scope to 'all'. A module
          # filter widens it to that module only. The i-* filters scope the
          # internals job the same way (a tools/ change still leaves internals
          # to the weekly run, as before — see the header note).
          filters: |
            core:
              - 'tools/**'
              - 'requirements*'
              - '.github/**'
            00-dataset: ['modules/00-dataset/**']
            01-ceteris-paribus: ['modules/01-ceteris-paribus/**']
            02-ice: ['modules/02-ice/**']
            03-lime: ['modules/03-lime/**']
            04-counterfactual: ['modules/04-counterfactual/**']
            05-shap: ['modules/05-shap/**']
            i-00-dataset: ['modules/00-dataset/notebooks/*_internals.ipynb']
            i-01-ceteris-paribus: ['modules/01-ceteris-paribus/notebooks/*_internals.ipynb']
            i-02-ice: ['modules/02-ice/notebooks/*_internals.ipynb']
            i-03-lime: ['modules/03-lime/notebooks/*_internals.ipynb']
            i-04-counterfactual: ['modules/04-counterfactual/notebooks/*_internals.ipynb']
            i-05-shap: ['modules/05-shap/notebooks/*_internals.ipynb']
      - name: Reduce matched filters to job scopes
        id: scope
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if echo "$CHANGED" | jq -e 'index("core")' >/dev/null; then
            echo 'walkthroughs=all' >> "$GITHUB_OUTPUT"
          else
            echo "walkthroughs=$(echo "$CHANGED" \
              | jq -c '[.[] | select(test("^[0-9]{2}-"))]')" >> "$GITHUB_OUTPUT"
          fi
          echo "internals=$(echo "$CHANGED" \
            | jq -c '[.[] | select(startswith("i-")) | .[2:]]')" >> "$GITHUB_OUTPUT"

  walkthroughs:
    needs: [changes]
    # Scoped on PRs (2026-09-01): a PR runs only the walkthroughs of the
    # modules it touches; tools/requirements/.github changes widen to all.
    # Push to main and the weekly canary still execute everything, so a
    # notebook broken by an out-of-scope change surfaces within a week.
    if: >-
      !cancelled() && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
         needs.changes.outputs.walkthroughs != '[]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30 # re-measured 2026-09-01: 539 s on the runner for all eight; a scoped PR usually runs one or two
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - name: Execute the in-scope walkthrough notebooks on the pinned stack
        env:
          SCOPE: ${{ needs.changes.outputs.walkthroughs }}
        run: |
          set -e
          shopt -s nullglob
          if [ -z "$SCOPE" ] || [ "$SCOPE" = "all" ]; then
            nbs=(modules/*/notebooks/*_walkthrough.ipynb)
            if [ ${#nbs[@]} -eq 0 ]; then echo "no walkthrough notebooks found" >&2; exit 1; fi
          else
            nbs=()
            for m in $(echo "$SCOPE" | jq -r '.[]'); do
              nbs+=(modules/"$m"/notebooks/*_walkthrough.ipynb)
            done
            if [ ${#nbs[@]} -eq 0 ]; then echo "modules in scope carry no walkthroughs"; exit 0; fi
          fi
          for nb in "${nbs[@]}"; do
            echo "::group::$nb"
            time jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=1200 \
              --output-dir "$RUNNER_TEMP/nbci" "$nb"
            echo "::endgroup::"
          done
      - name: Execution must not write into tracked or untracked repo paths
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  internals:
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.internals != '[]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45 # re-measured 2026-09-01: 879 s on the runner for all eight internals
    # (selection 261 + silver 238 + shap 113 + lime 100 + cp 96 + the rest under 30 s each);
    # a scoped PR runs only the touched modules' internals — the weekly run still covers all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - name: Execute the in-scope internals notebooks on the pinned stack
        env:
          SCOPE: ${{ needs.changes.outputs.internals }}
        run: |
          set -e
          shopt -s nullglob
          if [ -z "$SCOPE" ] || [ "${{ github.event_name }}" != "pull_request" ]; then
            nbs=(modules/*/notebooks/*_internals.ipynb)
            if [ ${#nbs[@]} -eq 0 ]; then echo "no internals notebooks found" >&2; exit 1; fi
          else
            nbs=()
            for m in $(echo "$SCOPE" | jq -r '.[]'); do
              nbs+=(modules/"$m"/notebooks/*_internals.ipynb)
            done
            if [ ${#nbs[@]} -eq 0 ]; then echo "modules in scope carry no internals"; exit 0; fi
          fi
          for nb in "${nbs[@]}"; do
            echo "::group::$nb"
            time jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=3600 \
              --output-dir "$RUNNER_TEMP/nbci" "$nb"
            echo "::endgroup::"
          done
      - name: Execution must not write into tracked or untracked repo paths
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  citation:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dieghernan/cff-validator@d8f85828214016ce6976e740b6e0504c0fdc4dbb # v5
