# Machine-checks for the rules CONTRIBUTING.md states in prose.
# Run locally with:  pre-commit run --all-files   (pip install pre-commit)
# CI runs the same hooks in the `checks` job.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: '\.(ipynb|png|pdf)$'
      - id: trailing-whitespace
        # md: trailing double-space is a hard break. tools/fonts/OFL-*.txt:
        # licence texts of third parties, redistributed byte-verbatim — a
        # trailing space in the OFL is theirs, not ours to tidy (2026-09-02).
        exclude: '(\.(ipynb|md)$|^tools/fonts/OFL-.*\.txt$)'
      - id: check-added-large-files
        args: ["--maxkb=4096"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        files: ^tools/
      - id: ruff-format
        files: ^tools/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        files: '\.(md|py|toml|yml|yaml)$'
        # codespell is an English checker. DICTIONARY.md quotes the SIVEP form's
        # Portuguese field labels verbatim — those are proper names of the
        # official source and must not be "corrected", so the file is excluded
        # rather than the hook loosened.
        # Both are generated artefacts that quote Portuguese source verbatim:
        # DICTIONARY.md the SIVEP form's field labels, PROFILE.md the raw data
        # values, including Brazilian place names. Correcting either would break
        # the link to the source.
        # 2026-08-31: William chose Portuguese for module 00's didactic
        # documents (README, GOLD) and the course ROADMAP — study material,
        # in the language he studies in. codespell checks English; excluding
        # deliberate-Portuguese prose beats teaching it Portuguese.
        # 2026-09-01: os módulos reescritos sobre o modelo COVID (01+) também
        # são material de estudo em português — READMEs e outlines entram na
        # exclusão como os do módulo 00.
        exclude: '^(modules/00-dataset/(DICTIONARY|PROFILE|COLUMNS|README|GOLD|MODEL|SELECTION)\.md|modules/00-dataset/gold/MANIFEST\.md|modules/[0-9]{2}-[a-z-]+/(README\.md|lecture/outline\.md)|ROADMAP\.md)$'
        # coo/fpr/mape: dataset and stats abbreviations (MAPE = mean absolute
        # percentage error). essencial: the SIVEP form's obligation class, a
        # proper name the generator matches on and the docs quote.
        # ehr: electronic health record, the term Kahn et al. use.
        # essencial/nome: Portuguese terms from the SIVEP form that the
        # generator matches on literally.
        # classe/datas/diagramas: Portuguese strings inside the SVG
        # generator, which draws its labels in the language of the docs.
        # autor: português no CRITERIO pré-registrado de srag_50_selection.py
        # ("HIPÓTESE DO AUTOR") — texto verbatim, não se reescreve.
        # 2026-09-01, fase/responde: os scripts numerados por FASE (a dezena
        # do nome) documentam a própria fase em português nos docstrings;
        # "fase" e "responde" são palavras do vocabulário da decisão, não
        # erros de digitação de "phase"/"respond". termo: os "termos" da
        # perda de Wachter, o vocabulário do módulo 04 — não "thermo".
        # 2026-09-02: `tools/sapians.py` (a identidade visual) e
        # `tools/check_numbers.py` (o conferidor prosa↔célula) são
        # documentados em português, como o material que servem, e os dois
        # levam docs em português ao lado (`tools/README.md`,
        # `tools/fonts/README.md`). "sinal" é o parâmetro público de
        # `SP.pt`/`SP.pct` (o `+` explícito de φ), "vai"/"ser"/"atual" são
        # vocabulário corrente da prosa e "extrator" é o que
        # `check_numbers.py` chama de extrator de números — nenhum deles é
        # "signal"/"set"/"actual" digitado errado.
        # 2026-09-03: "limite" é o limite da varredura em
        # `reports/01-metodos-locais/recortar_figuras.py`, e "argumentos" está
        # no docstring em português de `check_numbers.py` — nenhum dos dois é
        # "limit"/"arguments" digitado errado.
        args: ["-L", "coo,fpr,mape,essencial,ehr,nome,classe,datas,diagramas,erro,oficial,repete,saem,mede,dominante,funil,ordinal,manter,autor,fase,responde,termo,sinal,vai,ser,atual,extrator,limite,argumentos"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: gold-manifest-generated
        name: gold/MANIFEST.md matches counts.json + the decisions
        entry: python tools/srag_40_gold.py --check-manifest
        language: python
        additional_dependencies: ["pandas==2.3.3", "pyarrow==23.0.1"]
        files: ^(tools/srag_40_gold\.py|modules/00-dataset/gold/(counts\.json|MANIFEST\.md))$
        pass_filenames: false
      - id: columns-generated
        name: COLUMNS.md matches the contract tables
        # The generator reads only committed artifacts (the tables in
        # srag_30_silver.py + PROFILE.json), so this runs without the dataset.
        # srag_30_silver imports pandas/pyarrow at module load, hence the hook
        # venv — pinned to the same versions as requirements.lock.
        entry: python tools/srag_31_columns.py --check
        language: python
        additional_dependencies: ["pandas==2.3.3", "pyarrow==23.0.1"]
        files: ^(tools/(srag_30_silver|srag_31_columns)\.py|modules/00-dataset/(PROFILE\.json|COLUMNS\.md))$
        pass_filenames: false
      - id: diagrams-generated
        name: the four SVGs match their committed data sources
        # Ganhou hook em 2026-09-01, quando os diagramas passaram a ler
        # counts.json/selection_metrics.json/model_metrics.json — antes
        # liam só o contrato e o PROFILE, e o --check rodava à mão.
        entry: python tools/srag_32_diagrams.py --check
        language: python
        additional_dependencies: ["pandas==2.3.3", "pyarrow==23.0.1"]
        files: ^(tools/(srag_32_diagrams|srag_30_silver)\.py|modules/00-dataset/(PROFILE\.json|PIPELINE\.svg|FUNIL\.svg|REGIMES\.svg|SELECTION\.svg|gold/(counts|selection_metrics|model_metrics)\.json))$
        pass_filenames: false
      - id: model-card-generated
        name: MODEL.md matches model_metrics.json
        # O --check-card só compara MODEL.md com render_card(json) — não
        # re-treina nada, então roda com pandas/pyarrow como os outros dois.
        entry: python tools/srag_60_model.py --check-card
        language: python
        additional_dependencies: ["pandas==2.3.3", "pyarrow==23.0.1"]
        files: ^(tools/srag_60_model\.py|modules/00-dataset/(MODEL\.md|gold/model_metrics\.json))$
        pass_filenames: false
      - id: selection-card-generated
        name: SELECTION.md matches selection_metrics.json (e MELHORES bate com a busca)
        entry: python tools/srag_50_selection.py --check-card
        language: python
        additional_dependencies: ["pandas==2.3.3", "pyarrow==23.0.1"]
        files: ^(tools/srag_50_selection\.py|modules/00-dataset/(SELECTION\.md|gold/selection_metrics\.json))$
        pass_filenames: false
      - id: notebook-conventions
        name: notebook conventions (CONTRIBUTING.md)
        entry: python3 tools/check_notebooks.py
        language: system
        files: ^modules/.*/notebooks/.*\.ipynb$
        pass_filenames: true
